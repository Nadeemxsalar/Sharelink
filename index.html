<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShareLink - Seamless Cross-Device Sync</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Professional Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- QR Code Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { primary: '#2563eb' } } }
        }
    </script>
    <style>
        .hidden-mode { display: none !important; opacity: 0; pointer-events: none; }
        .modal-active { display: flex !important; opacity: 1; pointer-events: auto; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
        body { transition: background-color 0.3s, color 0.3s; }
        /* Smooth pop-up animation */
        .pop-animation { transition: all 0.3s ease-in-out; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 h-screen w-screen overflow-hidden flex flex-col font-sans">

    <!-- TOP NAVBAR -->
    <header class="w-full flex justify-between items-center px-4 py-3 md:px-8 md:py-4 bg-white dark:bg-gray-900 border-b border-gray-200 dark:border-gray-800 shadow-sm z-20 shrink-0 transition-colors">
        <div class="flex items-center gap-4">
            <div class="flex items-center gap-2 text-primary font-extrabold text-2xl md:text-3xl tracking-tight">
                <i data-lucide="link-2" class="w-7 h-7 md:w-8 md:h-8"></i>
                <span>Share<span class="text-gray-900 dark:text-white">Link</span></span>
            </div>
            <div class="hidden md:flex items-center gap-2 border-l border-gray-300 dark:border-gray-700 pl-4 ml-2">
                <span id="statusDot" class="w-2.5 h-2.5 rounded-full bg-yellow-500 animate-pulse"></span>
                <p class="text-xs font-semibold text-gray-500 dark:text-gray-400" id="statusIndicator">Connecting...</p>
            </div>
        </div>

        <div class="flex items-center gap-2 md:gap-4">
            <p id="lastUpdated" class="text-xs text-gray-400 hidden md:block mr-2 font-medium"></p>
            
            <button id="themeToggleBtn" class="p-2.5 rounded-full text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 transition" title="Toggle Theme">
                <i data-lucide="moon" id="themeIcon" class="w-5 h-5"></i>
            </button>
            <button id="downloadBtn" class="p-2.5 rounded-full text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 transition" title="Download Backup">
                <i data-lucide="download" class="w-5 h-5"></i>
            </button>
            <button id="qrBtn" class="p-2.5 rounded-full text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 transition" title="Show QR Code">
                <i data-lucide="qr-code" class="w-5 h-5"></i>
            </button>
            
            <button id="toggleBtn" class="bg-primary hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm md:text-base font-medium transition flex items-center gap-2 ml-1 md:ml-2 shadow-sm">
                <i data-lucide="file-edit" class="w-4 h-4"></i>
                <span>Full Edit</span>
            </button>
        </div>
    </header>

    <!-- MAIN APP AREA -->
    <main class="flex-1 w-full relative overflow-hidden flex flex-col bg-gray-50 dark:bg-gray-950 transition-colors">
        
        <!-- ================= VIEW MODE (Home) ================= -->
        <div id="viewMode" class="w-full h-full flex flex-col absolute inset-0">
            <div id="notesContainer" class="flex-1 overflow-y-auto p-4 md:p-8 md:px-20 lg:px-40 flex flex-col gap-3">
                <div class="text-gray-400 text-center mt-20 flex flex-col items-center justify-center gap-4">
                    <i data-lucide="loader" class="w-8 h-8 animate-spin"></i>
                    <p>Loading your data...</p>
                </div>
            </div>

            <!-- Quick Add Bar -->
            <div class="w-full bg-white dark:bg-gray-900 border-t border-gray-200 dark:border-gray-800 p-3 md:p-4 shrink-0 flex justify-center shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] z-10 transition-colors">
                <div class="w-full max-w-4xl flex gap-2">
                    <input type="text" id="quickInput" class="flex-1 bg-gray-50 dark:bg-gray-950 border border-gray-300 dark:border-gray-700 rounded-xl px-5 py-3.5 focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 text-base md:text-lg transition" placeholder="Paste link or type note here...">
                    <button id="quickSendBtn" class="bg-primary hover:bg-blue-700 text-white px-6 md:px-8 py-3.5 rounded-xl font-semibold transition shadow-sm flex items-center gap-2">
                        <span>Send</span>
                        <i data-lucide="send" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- ================= EDIT MODE (Card Based) ================= -->
        <div id="editMode" class="hidden-mode w-full h-full flex flex-col absolute inset-0 bg-gray-50 dark:bg-gray-950 z-20 transition-colors">
            <!-- Edit Action Bar -->
            <div class="w-full flex gap-2 p-3 bg-white dark:bg-gray-900 border-b border-gray-200 dark:border-gray-800 shrink-0 overflow-x-auto justify-center transition-colors shadow-sm">
                <div class="w-full max-w-4xl flex gap-2">
                    <button id="pasteBtn" class="bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 text-gray-800 dark:text-gray-200 px-4 py-2 rounded-lg font-medium whitespace-nowrap transition flex items-center gap-2">
                        <i data-lucide="clipboard-paste" class="w-4 h-4"></i> Paste New
                    </button>
                    <button id="copyBtn" class="bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 text-gray-800 dark:text-gray-200 px-4 py-2 rounded-lg font-medium whitespace-nowrap transition flex items-center gap-2">
                        <i data-lucide="copy" class="w-4 h-4"></i> Copy All
                    </button>
                    <button id="clearBtn" class="bg-red-50 dark:bg-red-900/20 text-red-600 dark:text-red-400 border border-red-200 dark:border-red-900 hover:bg-red-100 dark:hover:bg-red-900/40 px-4 py-2 rounded-lg font-medium whitespace-nowrap transition flex items-center gap-2 ml-auto">
                        <i data-lucide="trash-2" class="w-4 h-4"></i> Clear All
                    </button>
                </div>
            </div>

            <!-- Edit Cards Container -->
            <div id="editNotesContainer" class="flex-1 overflow-y-auto p-4 md:p-8 flex flex-col gap-4 w-full max-w-4xl mx-auto">
                <!-- Cards render here via JavaScript -->
            </div>
            
            <!-- Done Editing Button -->
            <div class="p-4 bg-white dark:bg-gray-900 border-t border-gray-200 dark:border-gray-800 shrink-0 flex justify-center transition-colors">
                <button id="doneBtn" class="w-full max-w-4xl bg-primary hover:bg-blue-700 text-white py-4 rounded-xl font-bold text-lg md:text-xl transition shadow-md flex justify-center items-center gap-2">
                    <i data-lucide="check-circle" class="w-5 h-5"></i> Done Editing
                </button>
            </div>
        </div>
    </main>

    <!-- ================= CUSTOM POP-UPS & MODALS ================= -->
    
    <!-- 1. Custom Delete Confirmation Modal -->
    <div id="confirmModal" class="hidden-mode pop-animation fixed inset-0 bg-black/60 backdrop-blur-sm z-[60] flex justify-center items-center p-4">
        <div class="bg-white dark:bg-gray-900 p-6 md:p-8 rounded-3xl shadow-2xl flex flex-col items-center max-w-sm w-full relative">
            <div class="w-16 h-16 bg-red-100 dark:bg-red-900/30 rounded-full flex justify-center items-center text-red-600 dark:text-red-400 mb-4 shadow-inner">
                <i data-lucide="alert-triangle" class="w-8 h-8"></i>
            </div>
            <h2 id="confirmTitle" class="text-2xl font-bold mb-2 text-gray-900 dark:text-white text-center">Are you sure?</h2>
            <p id="confirmMessage" class="text-sm text-gray-500 dark:text-gray-400 text-center mb-8 px-2">This action cannot be undone. It will be removed from all devices.</p>
            <div class="flex gap-3 w-full">
                <button id="cancelConfirmBtn" class="flex-1 bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 text-gray-800 dark:text-gray-200 py-3.5 rounded-xl font-semibold transition">
                    Cancel
                </button>
                <button id="acceptConfirmBtn" class="flex-1 bg-red-600 hover:bg-red-700 text-white py-3.5 rounded-xl font-semibold transition shadow-md flex justify-center items-center gap-2">
                    <i data-lucide="trash-2" class="w-4 h-4"></i> Delete
                </button>
            </div>
        </div>
    </div>

    <!-- 2. QR Code Modal -->
    <div id="qrModal" class="hidden-mode pop-animation fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex justify-center items-center p-4">
        <div class="bg-white dark:bg-gray-900 p-8 rounded-3xl shadow-2xl flex flex-col items-center max-w-sm w-full relative">
            <button id="closeQrBtn" class="absolute top-4 right-4 text-gray-400 hover:text-gray-700 dark:hover:text-white transition bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 p-2 rounded-full">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
            <h2 class="text-xl font-bold mb-1 mt-2 text-gray-900 dark:text-white text-center">Connect Device</h2>
            <p class="text-sm text-gray-500 text-center mb-6">Scan to open ShareLink on your mobile.</p>
            <div id="qrcode" class="p-4 bg-white rounded-xl shadow-inner border border-gray-200"></div>
        </div>
    </div>

    <!-- Firebase SDK & Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
        import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";

        lucide.createIcons();

        const firebaseConfig = {
            apiKey: "AIzaSyAU65jQ-1m4G_QgWCkn-9uue0xVY1Iz4Cc",
            authDomain: "sharelink-a2b25.firebaseapp.com",
            projectId: "sharelink-a2b25",
            storageBucket: "sharelink-a2b25.firebasestorage.app",
            messagingSenderId: "1089987797159",
            appId: "1:1089987797159:web:2519aa183938483042fb82",
            measurementId: "G-J9W368RJYG"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const noteDocRef = doc(db, "clipboard", "tv_note");

        const viewMode = document.getElementById('viewMode');
        const editMode = document.getElementById('editMode');
        const toggleBtn = document.getElementById('toggleBtn');
        const notesContainer = document.getElementById('notesContainer');
        const editNotesContainer = document.getElementById('editNotesContainer');
        const doneBtn = document.getElementById('doneBtn');
        const pasteBtn = document.getElementById('pasteBtn');
        const copyBtn = document.getElementById('copyBtn');
        const clearBtn = document.getElementById('clearBtn');
        const quickInput = document.getElementById('quickInput');
        const quickSendBtn = document.getElementById('quickSendBtn');
        const statusIndicator = document.getElementById('statusIndicator');
        const statusDot = document.getElementById('statusDot');
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const themeIcon = document.getElementById('themeIcon');
        const lastUpdated = document.getElementById('lastUpdated');

        let isEditMode = false;
        let latestText = "";
        let activeEditIndex = null;

        // ================= CUSTOM CONFIRM MODAL LOGIC =================
        const confirmModal = document.getElementById('confirmModal');
        const confirmTitle = document.getElementById('confirmTitle');
        const confirmMessage = document.getElementById('confirmMessage');
        const cancelConfirmBtn = document.getElementById('cancelConfirmBtn');
        const acceptConfirmBtn = document.getElementById('acceptConfirmBtn');
        let confirmCallback = null;

        window.showCustomConfirm = function(title, message, callback) {
            confirmTitle.innerText = title;
            confirmMessage.innerText = message;
            confirmCallback = callback;
            
            confirmModal.classList.remove('hidden-mode');
            confirmModal.classList.add('modal-active');
            lucide.createIcons();
        }

        cancelConfirmBtn.addEventListener('click', () => {
            confirmModal.classList.remove('modal-active');
            confirmModal.classList.add('hidden-mode');
            confirmCallback = null;
        });

        acceptConfirmBtn.addEventListener('click', () => {
            if(confirmCallback) confirmCallback();
            confirmModal.classList.remove('modal-active');
            confirmModal.classList.add('hidden-mode');
            confirmCallback = null;
        });
        // ==============================================================

        // Theme Logic
        themeToggleBtn.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
            const isDark = document.documentElement.classList.contains('dark');
            themeIcon.setAttribute('data-lucide', isDark ? 'sun' : 'moon');
            lucide.createIcons();
        });

        // Toggle Modes
        toggleBtn.addEventListener('click', () => {
            isEditMode = !isEditMode;
            activeEditIndex = null;
            if (isEditMode) {
                viewMode.classList.add('hidden-mode');
                editMode.classList.remove('hidden-mode');
                toggleBtn.innerHTML = `<i data-lucide="eye" class="w-4 h-4"></i> <span>View Notes</span>`;
                toggleBtn.classList.replace('bg-primary', 'bg-gray-800');
                toggleBtn.classList.replace('hover:bg-blue-700', 'hover:bg-gray-900');
                renderEditModeText();
            } else {
                editMode.classList.add('hidden-mode');
                viewMode.classList.remove('hidden-mode');
                toggleBtn.innerHTML = `<i data-lucide="file-edit" class="w-4 h-4"></i> <span>Full Edit</span>`;
                toggleBtn.classList.replace('bg-gray-800', 'bg-primary');
                toggleBtn.classList.replace('hover:bg-gray-900', 'hover:bg-blue-700');
            }
            lucide.createIcons();
        });
        
        doneBtn.addEventListener('click', () => toggleBtn.click());

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, tag => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'}[tag] || tag));
        }

        // ================= VIEW MODE RENDER =================
        function renderViewModeText(text) {
            if (!text || text.trim() === "") {
                notesContainer.innerHTML = `
                    <div class="flex flex-col items-center justify-center h-full opacity-40 mt-10">
                        <i data-lucide="inbox" class="w-16 h-16 mb-4"></i>
                        <p class="text-xl font-semibold">Ready to receive links</p>
                        <p class="mt-1 text-sm">Paste a link below and hit send.</p>
                    </div>`;
                lucide.createIcons();
                return;
            }

            const urlRegex = /(https?:\/\/[^\s]+)/g;
            const lines = text.split('\n').filter(line => line.trim() !== '');
            
            let htmlContent = "";
            lines.forEach(line => {
                let safeLine = escapeHTML(line);
                const matches = line.match(urlRegex);
                const firstUrl = matches ? matches[0] : null; 
                
                let linkedLine = safeLine.replace(urlRegex, function(url) {
                    return `<span class="text-primary font-semibold underline underline-offset-2 break-all">${url}</span>`;
                });

                const iconName = firstUrl ? 'link' : 'align-left';
                const clickAttr = firstUrl ? `onclick="window.open('${firstUrl}', '_blank')"` : '';
                const cursorClass = firstUrl ? 'cursor-pointer hover:bg-white dark:hover:bg-gray-800 hover:shadow-md border-transparent hover:border-blue-200 dark:hover:border-blue-900/50' : 'hover:bg-white dark:hover:bg-gray-800/50 border-transparent';
                
                htmlContent += `
                    <div ${clickAttr} class="group w-full border border-gray-200 border-b-gray-300 dark:border-gray-800 py-4 px-4 text-gray-800 dark:text-gray-200 text-lg md:text-xl flex items-start gap-4 rounded-xl transition-all ${cursorClass}">
                        <div class="mt-1 text-gray-400 group-hover:text-primary transition-colors shrink-0">
                            <i data-lucide="${iconName}" class="w-6 h-6"></i>
                        </div>
                        <div class="w-full whitespace-pre-wrap leading-relaxed">${linkedLine}</div>
                        ${firstUrl ? `<div class="opacity-0 group-hover:opacity-100 transition-opacity text-primary shrink-0 mt-1"><i data-lucide="external-link" class="w-5 h-5"></i></div>` : ''}
                    </div>
                `;
            });
            
            notesContainer.innerHTML = htmlContent;
            lucide.createIcons();
            notesContainer.scrollTop = notesContainer.scrollHeight;
        }

        // ================= EDIT MODE RENDER =================
        window.renderEditModeText = function() {
            if (activeEditIndex !== null) return; 
            
            const lines = latestText.split('\n').filter(line => line.trim() !== '');
            if (lines.length === 0) {
                editNotesContainer.innerHTML = `<div class="text-center text-gray-400 mt-10 flex flex-col items-center"><i data-lucide="file-x" class="w-12 h-12 mb-3 opacity-30"></i> No notes to edit.</div>`;
                lucide.createIcons();
                return;
            }

            let htmlContent = "";
            lines.forEach((line, index) => {
                let safeLine = escapeHTML(line);
                htmlContent += `
                    <div id="edit-card-${index}" onclick="openInlineEdit(${index})" class="group w-full border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900 hover:border-primary/50 p-4 md:p-5 rounded-xl text-gray-800 dark:text-gray-200 flex justify-between items-start gap-4 shadow-sm transition hover:shadow-md cursor-pointer">
                        <div class="whitespace-pre-wrap leading-relaxed flex-1">${safeLine}</div>
                        <div class="flex gap-2 text-gray-400 shrink-0 md:opacity-0 group-hover:opacity-100 transition-opacity">
                            <button onclick="event.stopPropagation(); deleteLine(${index})" class="p-2 hover:text-red-600 hover:bg-red-50 dark:hover:bg-red-900/30 rounded-lg transition" title="Delete Note">
                                <i data-lucide="trash-2" class="w-5 h-5"></i>
                            </button>
                            <button class="p-2 text-primary hover:bg-blue-50 dark:hover:bg-blue-900/30 rounded-lg transition" title="Edit Note">
                                <i data-lucide="pencil" class="w-5 h-5"></i>
                            </button>
                        </div>
                    </div>
                `;
            });
            
            editNotesContainer.innerHTML = htmlContent;
            lucide.createIcons();
        }

        // ================= INLINE EDIT LOGIC =================
        window.openInlineEdit = function(index) {
            activeEditIndex = index;
            const lines = latestText.split('\n').filter(line => line.trim() !== '');
            const card = document.getElementById(`edit-card-${index}`);
            
            card.className = "w-full border-2 border-primary dark:border-primary bg-white dark:bg-gray-900 p-4 md:p-5 rounded-xl shadow-lg transition pop-animation";
            card.onclick = null; 
            
            card.innerHTML = `
                <textarea id="inline-input" class="w-full bg-transparent text-gray-900 dark:text-gray-100 focus:outline-none resize-none text-lg leading-relaxed border-b border-gray-200 dark:border-gray-800 pb-3 mb-3" rows="3" placeholder="Edit your note..."></textarea>
                <div class="flex justify-end gap-2">
                    <button onclick="cancelInlineEdit()" class="px-5 py-2.5 text-gray-600 dark:text-gray-400 font-semibold hover:bg-gray-100 dark:hover:bg-gray-800 rounded-lg transition flex items-center gap-2"><i data-lucide="x" class="w-4 h-4"></i> Cancel</button>
                    <button onclick="saveInlineEdit(${index})" class="px-6 py-2.5 bg-primary hover:bg-blue-700 text-white font-semibold rounded-lg transition shadow-sm flex items-center gap-2"><i data-lucide="check" class="w-4 h-4"></i> Save</button>
                </div>
            `;
            
            const input = document.getElementById('inline-input');
            input.value = lines[index];
            input.focus();
            input.setSelectionRange(input.value.length, input.value.length);
            lucide.createIcons();
        };

        window.cancelInlineEdit = function() {
            activeEditIndex = null;
            renderEditModeText();
        }

        window.saveInlineEdit = async function(index) {
            const newVal = document.getElementById('inline-input').value.trim();
            let lines = latestText.split('\n').filter(line => line.trim() !== '');
            
            if (newVal === "") { lines.splice(index, 1); }
            else { lines[index] = newVal; }
            
            const success = await updateFirebaseText(lines.join('\n'));
            if (success) {
                activeEditIndex = null;
                renderEditModeText(); 
            }
        }

        window.deleteLine = function(index) {
            showCustomConfirm("Delete this note?", "Are you sure you want to remove this specific note from all devices?", async () => {
                let lines = latestText.split('\n').filter(line => line.trim() !== '');
                lines.splice(index, 1);
                const success = await updateFirebaseText(lines.join('\n'));
                if(success) {
                    activeEditIndex = null;
                    renderEditModeText();
                }
            });
        }

        // ================= FIREBASE SYNC =================
        async function updateFirebaseText(newText) {
            try {
                await setDoc(noteDocRef, { text: newText, timestamp: new Date().getTime() });
                return true;
            } catch (err) {
                console.error("Firebase Error: ", err);
                return false;
            }
        }

        onSnapshot(noteDocRef, (docSnap) => {
            statusIndicator.innerText = "Online";
            statusIndicator.classList.replace('text-gray-500', 'text-emerald-600');
            statusDot.classList.replace('bg-yellow-500', 'bg-emerald-500');
            statusDot.classList.remove('animate-pulse');
            
            if (docSnap.exists()) {
                const data = docSnap.data();
                latestText = data.text || "";
                if(data.timestamp) {
                    lastUpdated.innerText = `Updated: ${new Date(data.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}`;
                }
            } else {
                latestText = "";
            }
            
            renderViewModeText(latestText);
            if (isEditMode && activeEditIndex === null) {
                renderEditModeText();
            }
        }, (error) => {
            statusIndicator.innerText = "Offline";
            statusIndicator.classList.replace('text-emerald-600', 'text-red-500');
            statusDot.classList.replace('bg-emerald-500', 'bg-red-500');
        });

        // ================= GLOBAL ACTIONS =================
        quickSendBtn.addEventListener('click', async () => {
            const newText = quickInput.value.trim();
            if(!newText) return;
            const combinedText = latestText ? `${latestText}\n${newText}` : newText;
            
            const originalHTML = quickSendBtn.innerHTML;
            quickSendBtn.innerHTML = `<i data-lucide="loader" class="w-5 h-5 animate-spin"></i>`;
            lucide.createIcons();
            
            const success = await updateFirebaseText(combinedText);
            if(success) quickInput.value = "";
            
            setTimeout(() => { 
                quickSendBtn.innerHTML = originalHTML; 
                lucide.createIcons();
            }, 500);
        });
        quickInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') quickSendBtn.click(); });

        clearBtn.addEventListener('click', () => {
            if(!latestText.trim()) return; // Don't show modal if already empty
            
            showCustomConfirm("Clear All Notes?", "Do you want to delete ALL notes? This will instantly wipe them from your TV and phone.", async () => {
                await updateFirebaseText("");
            });
        });

        copyBtn.addEventListener('click', async () => {
            try {
                if(!latestText.trim()) return;
                await navigator.clipboard.writeText(latestText);
                
                const original = copyBtn.innerHTML;
                copyBtn.innerHTML = `<i data-lucide="check" class="w-4 h-4"></i> Copied!`;
                lucide.createIcons();
                setTimeout(() => { copyBtn.innerHTML = original; lucide.createIcons(); }, 1500);
            } catch(e) { document.execCommand('copy'); }
        });

        pasteBtn.addEventListener('click', async () => {
            try {
                const text = await navigator.clipboard.readText();
                if(text.trim() === "") return;
                const newText = latestText ? `${latestText}\n${text}` : text;
                await updateFirebaseText(newText);
            } catch(e) { /* Fallback for browsers blocking clipboard */ }
        });

        // QR Modal Logic
        const qrBtn = document.getElementById('qrBtn');
        const qrModal = document.getElementById('qrModal');
        const closeQrBtn = document.getElementById('closeQrBtn');
        let qrGenerated = false;
        
        qrBtn.addEventListener('click', () => {
            qrModal.classList.remove('hidden-mode');
            qrModal.classList.add('modal-active');
            if(!qrGenerated) {
                new QRCode(document.getElementById("qrcode"), { text: window.location.href, width: 180, height: 180 });
                qrGenerated = true;
            }
        });
        closeQrBtn.addEventListener('click', () => {
            qrModal.classList.remove('modal-active');
            qrModal.classList.add('hidden-mode');
        });
        
        // Download logic
        document.getElementById('downloadBtn').addEventListener('click', () => {
            if(!latestText) return;
            const blob = new Blob([latestText], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = `ShareLink_Backup_${new Date().toLocaleDateString()}.txt`; a.click();
            URL.revokeObjectURL(url);
        });

    </script>
</body>
</html>
