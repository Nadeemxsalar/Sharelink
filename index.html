<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#f9fafb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ShareLink">
    <meta name="application-name" content="ShareLink">
    <title>ShareLink - Seamless Cross-Device Sync</title>
    
    <!-- SVG Favicon Added -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232563eb' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><path d='M9 17H7A5 5 0 0 1 7 7h2'/><path d='M15 7h2a5 5 0 1 1 0 10h-2'/><line x1='8' x2='16' y1='12' y2='12'/></svg>">
    
    <!-- Apple Touch Icon (iOS Home Screen) -->
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23ffffff' stroke='%232563eb' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect width='24' height='24' fill='%23ffffff'/><path d='M9 17H7A5 5 0 0 1 7 7h2'/><path d='M15 7h2a5 5 0 1 1 0 10h-2'/><line x1='8' x2='16' y1='12' y2='12'/></svg>">
    
    <!-- Web App Manifest (Android Home Screen / Quick Save) -->
    <link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22ShareLink%22%2C%22short_name%22%3A%22ShareLink%22%2C%22display%22%3A%22standalone%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22data%3Aimage%2Fsvg%2Bxml%2C%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%2024%2024'%20fill%3D'none'%20stroke%3D'%25232563eb'%20stroke-width%3D'2.5'%20stroke-linecap%3D'round'%20stroke-linejoin%3D'round'%3E%3Cpath%20d%3D'M9%2017H7A5%205%200%200%201%207%207h2'%2F%3E%3Cpath%20d%3D'M15%207h2a5%205%200%201%201%200%2010h-2'%2F%3E%3Cline%20x1%3D'8'%20x2%3D'16'%20y1%3D'12'%20y2%3D'12'%2F%3E%3C%2Fsvg%3E%22%2C%22sizes%22%3A%22192x192%20512x512%22%2C%22type%22%3A%22image%2Fsvg%2Bxml%22%7D%5D%7D">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Professional Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- QR Code Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { primary: '#2563eb' } } }
        }
    </script>
    <style>
        .hidden-mode { display: none !important; opacity: 0; pointer-events: none; }
        .modal-active { display: flex !important; opacity: 1; pointer-events: auto; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
        body { transition: background-color 0.3s, color 0.3s; overscroll-behavior-y: none; }
        .pop-animation { transition: all 0.3s ease-in-out; }
        
        /* ================= VERCEL & NETLIFY WATERMARK REMOVER ================= */
        #netlify-badge, netlify-badge, #netlify-toolbar, netlify-toolbar, netlify-web-toolbar, .netlify-badge,
        #vercel-toolbar, vercel-toolbar, .vercel-toolbar, #vercel-live-feedback, vercel-live-feedback { 
            display: none !important; 
            visibility: hidden !important; 
            opacity: 0 !important; 
            pointer-events: none !important; 
            z-index: -9999 !important;
        }

        /* ================= TITLE FEATURE STYLES ================= */

        /* Title field that slides open (Add popup + quick bar) */
        .name-collapse {
            display: grid;
            grid-template-rows: 0fr;
            opacity: 0;
            visibility: hidden;
            transition: grid-template-rows .3s ease, opacity .25s ease, visibility 0s linear .3s;
        }
        .name-collapse.open {
            grid-template-rows: 1fr;
            opacity: 1;
            visibility: visible;
            transition-delay: 0s;
        }
        .name-collapse > .nc-wrap { overflow: hidden; min-height: 0; }
        .nc-inner { padding: 3px 3px 12px; }

        /* "Add Title" tag pill (Add popup header) -> turns into red "Remove Title" */
        .title-pill {
            display: flex; align-items: center; gap: .375rem;
            padding: .375rem .8rem; border-radius: 999px;
            background: #eff6ff; color: #2563eb;
            font-size: .8125rem; font-weight: 600; line-height: 1.2;
            cursor: pointer; transition: background .2s ease, color .2s ease, transform .15s ease;
        }
        .title-pill:hover { background: #dbeafe; }
        .title-pill:active { transform: scale(.95); }
        .title-pill[aria-pressed="true"] { background: #fef2f2; color: #ef4444; }
        .title-pill[aria-pressed="true"]:hover { background: #fee2e2; }
        .dark .title-pill { background: rgba(30,58,138,.4); color: #60a5fa; }
        .dark .title-pill:hover { background: rgba(30,58,138,.6); }
        .dark .title-pill[aria-pressed="true"] { background: rgba(127,29,29,.4); color: #f87171; }

        /* Icon-only tag toggle (bottom quick add bar) */
        .name-toggle-icon {
            flex-shrink: 0; width: 3rem; display: flex; align-items: center; justify-content: center;
            border-radius: .75rem; border: 1px solid #d1d5db; background: #f9fafb; color: #64748b;
            cursor: pointer; transition: all .25s ease;
        }
        .name-toggle-icon:hover { color: #2563eb; border-color: #2563eb; }
        .dark .name-toggle-icon { border-color: #374151; background: #030712; color: #94a3b8; }
        .dark .name-toggle-icon:hover { color: #60a5fa; border-color: #3b82f6; }
        .name-toggle-icon[aria-pressed="true"],
        .dark .name-toggle-icon[aria-pressed="true"] {
            background: #0f172a; border-color: #0f172a; color: #ffffff;
            box-shadow: 0 4px 10px -2px rgba(15,23,42,.45);
        }

        /* Sabhi cards ka size same rahega (view + edit list), chahe link/text chhota ho ya bahut lamba */
        .note-box { height: 8rem; }
        @media (min-width: 768px) { .note-box { height: 8.75rem; } }

        /* Edit mode: card that has a title gets an amber edge */
        .named-accent { border-left-width: 4px !important; border-left-color: #f59e0b !important; }

        /* Search icon (header) jab search bar khula ho */
        #searchBtn[aria-pressed="true"] { background: rgba(37,99,235,.12); color: #2563eb; }
        .dark #searchBtn[aria-pressed="true"] { background: rgba(96,165,250,.18); color: #60a5fa; }

        /* Title me jo text match hua uska highlight */
        mark.search-hit { background: rgba(245,158,11,.30); color: inherit; border-radius: 3px; padding: 0 1px; }
        .dark mark.search-hit { background: rgba(245,158,11,.40); }

        @media (prefers-reduced-motion: reduce) {
            .name-collapse, .title-pill, .name-toggle-icon { transition: none !important; }
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 h-[100dvh] w-screen overflow-hidden flex flex-col font-sans">

    <!-- TOP NAVBAR -->
    <header class="w-full flex justify-between items-center px-4 py-3 md:px-8 md:py-4 bg-white dark:bg-gray-900 border-b border-gray-200 dark:border-gray-800 shadow-sm z-20 shrink-0 transition-colors">
        <div class="flex items-center gap-4">
            <div id="logoBtn" title="Folders and filter" class="relative cursor-pointer select-none flex items-center gap-2 text-primary font-extrabold text-2xl md:text-3xl tracking-tight">
                <!-- Inline SVG Logo (Same as Favicon) -->
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="w-7 h-7 md:w-8 md:h-8">
                    <path d="M9 17H7A5 5 0 0 1 7 7h2"/>
                    <path d="M15 7h2a5 5 0 1 1 0 10h-2"/>
                    <line x1="8" x2="16" y1="12" y2="12"/>
                </svg>
                <span>Share<span class="text-gray-900 dark:text-white">Link</span></span><span id="navDot" class="hidden absolute -top-0.5 -right-2.5 w-2.5 h-2.5 rounded-full bg-amber-500"></span>
            </div>
            <div class="hidden md:flex items-center gap-2 border-l border-gray-300 dark:border-gray-700 pl-4 ml-2">
                <span id="statusDot" class="w-2.5 h-2.5 rounded-full bg-yellow-500 animate-pulse"></span>
                <p class="text-xs font-semibold text-gray-500 dark:text-gray-400" id="statusIndicator">Connecting...</p>
            </div>
        </div>

        <div class="flex items-center gap-2 md:gap-4">
            <p id="lastUpdated" class="text-xs text-gray-400 hidden md:block mr-2 font-medium"></p>
            
            <button id="themeToggleBtn" class="p-2.5 rounded-full text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 transition" title="Toggle Theme">
                <i data-lucide="moon" id="themeIcon" class="w-5 h-5"></i>
            </button>
            <button id="searchBtn" type="button" aria-pressed="false" class="p-2.5 rounded-full text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 transition" title="Search by title">
                <i data-lucide="search" class="w-5 h-5"></i>
            </button>
            <button id="qrBtn" class="p-2.5 rounded-full text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 transition" title="Show QR Code">
                <i data-lucide="qr-code" class="w-5 h-5"></i>
            </button>
            
            <button id="toggleBtn" class="bg-primary hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm md:text-base font-medium transition flex items-center gap-2 ml-1 md:ml-2 shadow-sm shrink-0">
                <i data-lucide="file-edit" class="w-4 h-4"></i>
                <span class="hidden md:inline">Full Edit</span>
            </button>
        </div>
    </header>

    <!-- SEARCH BAR (search icon par click karne se khulta hai) -->
    <div id="searchBar" class="name-collapse w-full shrink-0 z-10">
        <div class="nc-wrap">
            <div class="px-4 py-3 md:px-8 bg-white dark:bg-gray-900 border-b border-gray-200 dark:border-gray-800">
                <div class="w-full max-w-4xl mx-auto flex items-center gap-3">
                    <div class="relative flex-1 min-w-0">
                        <i data-lucide="search" class="w-5 h-5 text-gray-400 absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none"></i>
                        <input type="text" id="searchInput" autocomplete="off" spellcheck="false" enterkeyhint="search" class="w-full bg-gray-50 dark:bg-gray-950 border border-gray-300 dark:border-gray-700 rounded-xl pl-11 pr-4 py-2.5 md:py-3 focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 text-base md:text-lg transition text-gray-900 dark:text-gray-100 placeholder-gray-400" placeholder="Search by title...">
                    </div>
                    <span id="searchCount" class="hidden shrink-0 text-xs md:text-sm font-semibold text-gray-500 dark:text-gray-400 whitespace-nowrap"></span>
                    <button id="searchCloseBtn" type="button" class="shrink-0 p-2.5 rounded-full text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 hover:text-gray-900 dark:hover:text-white active:scale-95 transition" title="Close search">
                        <i data-lucide="x" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- FOLDER / FILTER BAR -->
    <div id="navBar" class="hidden-mode w-full shrink-0 z-10 bg-white dark:bg-gray-900 border-b border-gray-200 dark:border-gray-800 px-4 md:px-8 py-1.5">
        <div class="w-full max-w-4xl mx-auto flex items-center gap-2">
            <div id="crumbs" class="flex items-center gap-1 text-sm md:text-base font-semibold overflow-x-auto whitespace-nowrap min-w-0 flex-1"></div>
            <div class="relative shrink-0">
                <button id="filterBtn" type="button" title="Filter" class="relative p-2.5 rounded-full text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 transition"><i data-lucide="filter" class="w-5 h-5"></i><span id="filterDot" class="hidden absolute top-1.5 right-1.5 w-2 h-2 rounded-full bg-primary"></span></button>
                <div id="filterMenu" class="hidden absolute right-0 top-full mt-2 w-44 bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-xl shadow-xl p-1.5 z-50"></div>
            </div>
        </div>
    </div>

    <!-- MAIN APP AREA -->
    <main class="flex-1 w-full relative overflow-hidden flex flex-col bg-gray-50 dark:bg-gray-950 transition-colors">
        
        <!-- ================= VIEW MODE (Home) ================= -->
        <div id="viewMode" class="w-full h-full flex flex-col absolute inset-0">
            <!-- Container max-width fixed for clean layout -->
            <div id="notesContainer" class="flex-1 overflow-y-auto p-4 md:p-8 flex flex-col gap-3 md:gap-4 w-full max-w-4xl mx-auto">
                <div class="text-gray-400 text-center mt-20 flex flex-col items-center justify-center gap-4">
                    <i data-lucide="loader" class="w-8 h-8 animate-spin"></i>
                    <p>Loading your data...</p>
                </div>
            </div>

            <!-- Quick Add Bar -->
            <div class="w-full bg-white dark:bg-gray-900 border-t border-gray-200 dark:border-gray-800 p-3 md:p-4 shrink-0 flex justify-center shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] z-10 transition-colors pb-safe">
                <div class="w-full max-w-4xl flex flex-col">
                    <!-- Title field (slides open when the tag button is on) -->
                    <div id="quickNameCollapse" class="name-collapse w-full">
                        <div class="nc-wrap"><div class="nc-inner">
                            <div class="relative">
                                <i data-lucide="tag" class="w-4 h-4 text-gray-500 dark:text-gray-400 absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none"></i>
                                <input type="text" id="quickName" maxlength="40" autocomplete="off" class="w-full min-w-0 bg-gray-50 dark:bg-gray-950 border border-gray-300 dark:border-gray-700 rounded-xl pl-10 pr-4 py-3 md:py-3.5 focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 text-base md:text-lg transition text-gray-900 dark:text-gray-100 placeholder-gray-400" placeholder="Title, e.g. Bigg Boss movie">
                            </div>
                        </div></div>
                    </div>

                    <div class="w-full flex gap-2">
                        <button id="quickNameToggle" type="button" data-name-toggle data-target="quickNameCollapse" aria-pressed="false" class="name-toggle-icon" title="Add a title">
                            <i data-lucide="tag" class="w-5 h-5"></i>
                        </button>
                        
                        <input type="text" id="quickInput" class="flex-1 min-w-0 bg-gray-50 dark:bg-gray-950 border border-gray-300 dark:border-gray-700 rounded-xl px-4 md:px-5 py-3 md:py-3.5 focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 text-base md:text-lg transition" placeholder="Paste link or type note here...">
                        <button id="quickSendBtn" class="shrink-0 bg-primary hover:bg-blue-700 text-white px-4 md:px-8 py-3 md:py-3.5 rounded-xl font-semibold transition shadow-sm flex items-center gap-2">
                            <span class="hidden md:inline">Send</span>
                            <i data-lucide="send" class="w-5 h-5"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- ================= EDIT MODE (Card Based) ================= -->
        <div id="editMode" class="hidden-mode w-full h-full flex flex-col absolute inset-0 bg-gray-50 dark:bg-gray-950 z-20 transition-colors">
            <!-- Edit Action Bar -->
            <div class="w-full flex gap-2 p-3 bg-white dark:bg-gray-900 border-b border-gray-200 dark:border-gray-800 shrink-0 overflow-x-auto justify-start md:justify-center transition-colors shadow-sm">
                <div class="w-full max-w-4xl flex gap-2">
                    <button id="addBtn" class="shrink-0 bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 text-gray-800 dark:text-gray-200 px-4 py-2 rounded-lg font-medium whitespace-nowrap transition flex items-center gap-2">
                        <i data-lucide="plus-circle" class="w-4 h-4"></i> Add New
                    </button>
                    <button id="newDirEditBtn" onclick="newDir()" class="shrink-0 bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 text-gray-800 dark:text-gray-200 px-4 py-2 rounded-lg font-medium whitespace-nowrap transition flex items-center gap-2"><i data-lucide="folder-plus" class="w-4 h-4"></i> New Folder</button>
                    <button id="copyBtn" class="shrink-0 bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 text-gray-800 dark:text-gray-200 px-4 py-2 rounded-lg font-medium whitespace-nowrap transition flex items-center gap-2">
                        <i data-lucide="copy" class="w-4 h-4"></i> Copy All
                    </button>
                    <button id="exportBtn" class="shrink-0 bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 text-gray-800 dark:text-gray-200 px-4 py-2 rounded-lg font-medium whitespace-nowrap transition flex items-center gap-2"><i data-lucide="download" class="w-4 h-4"></i> Export</button>
                    <button id="importBtn" class="shrink-0 bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 text-gray-800 dark:text-gray-200 px-4 py-2 rounded-lg font-medium whitespace-nowrap transition flex items-center gap-2"><i data-lucide="upload" class="w-4 h-4"></i> Import</button>
                    <input type="file" id="importInput" accept=".json,application/json" class="hidden">
                    <button id="clearBtn" class="shrink-0 bg-red-50 dark:bg-red-900/20 text-red-600 dark:text-red-400 border border-red-200 dark:border-red-900 hover:bg-red-100 dark:hover:bg-red-900/40 px-4 py-2 rounded-lg font-medium whitespace-nowrap transition flex items-center gap-2 ml-auto">
                        <i data-lucide="trash-2" class="w-4 h-4"></i> Clear All
                    </button>
                </div>
            </div>

            <!-- Edit Cards Container -->
            <div id="editNotesContainer" class="flex-1 overflow-y-auto p-4 md:p-8 flex flex-col gap-3 md:gap-4 w-full max-w-4xl mx-auto">
                <!-- Cards render here via JavaScript -->
            </div>
            
            <!-- Done Editing Button -->
            <div class="p-4 bg-white dark:bg-gray-900 border-t border-gray-200 dark:border-gray-800 shrink-0 flex justify-center transition-colors pb-safe">
                <button id="doneBtn" class="w-full max-w-4xl bg-primary hover:bg-blue-700 text-white py-4 rounded-xl font-bold text-lg md:text-xl transition shadow-md flex justify-center items-center gap-2">
                    <i data-lucide="check-circle" class="w-5 h-5"></i> Done Editing
                </button>
            </div>
        </div>
    </main>

    <!-- ================= CUSTOM POP-UPS & MODALS ================= -->
    
    <!-- 1. Add / Paste New Note Modal (with Add Title tag) -->
    <div id="addNoteModal" class="hidden-mode pop-animation fixed inset-0 bg-black/60 backdrop-blur-sm z-[60] flex justify-center items-center p-4">
        <div class="bg-white dark:bg-gray-900 p-6 md:p-8 rounded-3xl shadow-2xl flex flex-col items-center max-w-lg w-full relative max-h-[92dvh] overflow-y-auto">
            <div class="flex justify-between items-center gap-3 w-full mb-4">
                <h2 class="text-lg md:text-xl font-bold text-gray-900 dark:text-white leading-tight">Add New Link or Text</h2>
                <!-- Add Title tag -->
                <button type="button" id="addNameToggle" data-name-toggle data-target="addNameCollapse" data-on-text="Remove Title" data-off-text="Add Title" aria-pressed="false" class="title-pill shrink-0">
                    <i data-lucide="tag" class="w-3.5 h-3.5"></i><span data-label>Add Title</span>
                </button>
            </div>

            <!-- Title field (opens when the tag is clicked) -->
            <div id="addNameCollapse" class="name-collapse w-full">
                <div class="nc-wrap"><div class="nc-inner">
                    <div class="relative">
                        <i data-lucide="tag" class="w-4 h-4 text-gray-500 dark:text-gray-400 absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none"></i>
                        <input type="text" id="newNameInput" maxlength="40" autocomplete="off" class="w-full bg-gray-50 dark:bg-gray-950 border border-gray-300 dark:border-gray-700 rounded-xl pl-10 pr-4 py-3 focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 text-base md:text-lg font-semibold transition text-gray-900 dark:text-gray-100 placeholder-gray-400 placeholder:font-normal" placeholder="Give this link a name (e.g. My Portfolio)">
                    </div>
                </div></div>
            </div>
            
            <textarea id="newNoteInput" class="w-full bg-gray-50 dark:bg-gray-950 border border-gray-300 dark:border-gray-700 rounded-xl px-4 py-3 focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 text-base md:text-lg transition text-gray-900 dark:text-gray-100 mb-6 resize-none whitespace-pre-wrap" rows="5" placeholder="Type or Paste Code here..."></textarea>
            
            <div class="flex gap-3 w-full">
                <button id="cancelAddBtn" class="flex-1 bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 text-gray-800 dark:text-gray-200 py-3.5 rounded-xl font-semibold transition disabled:opacity-50">
                    Cancel
                </button>
                <button id="saveAddBtn" class="flex-1 bg-primary hover:bg-blue-700 text-white py-3.5 rounded-xl font-semibold transition shadow-md flex justify-center items-center gap-2 disabled:opacity-80">
                    <i data-lucide="plus" class="w-4 h-4"></i> Save Note
                </button>
            </div>
        </div>
    </div>

    <!-- 2. Custom Delete Confirmation Modal -->
    <div id="confirmModal" class="hidden-mode pop-animation fixed inset-0 bg-black/60 backdrop-blur-sm z-[60] flex justify-center items-center p-4">
        <div class="bg-white dark:bg-gray-900 p-6 md:p-8 rounded-3xl shadow-2xl flex flex-col items-center max-w-sm w-full relative">
            <div class="w-16 h-16 bg-red-100 dark:bg-red-900/30 rounded-full flex justify-center items-center text-red-600 dark:text-red-400 mb-4 shadow-inner">
                <i data-lucide="alert-triangle" class="w-8 h-8"></i>
            </div>
            <h2 id="confirmTitle" class="text-2xl font-bold mb-2 text-gray-900 dark:text-white text-center">Are you sure?</h2>
            <p id="confirmMessage" class="text-sm text-gray-500 dark:text-gray-400 text-center mb-8 px-2">This action cannot be undone. It will be removed from all devices.</p>
            <div class="flex gap-3 w-full">
                <button id="cancelConfirmBtn" class="flex-1 bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 text-gray-800 dark:text-gray-200 py-3.5 rounded-xl font-semibold transition disabled:opacity-50">
                    Cancel
                </button>

        const searchBtn = document.getElementById('searchBtn');

        // Har word title me hona chahiye ("big boss" -> "Big Boss 39 Episode" mil jaayega)
        function titleMatches(name) {
            if (!name) return false;
            const t = name.toLowerCase();
            return searchTerms.every(term => t.includes(term));
        }

        // Title ke jo hisse match hue unko highlight karta hai (HTML safe)
        function highlightTitle(name) {
            if (!searchTerms.length) return escapeHTML(name);
            const lower = name.toLowerCase();
            if (lower.length !== name.length) return escapeHTML(name);
            const hit = new Array(name.length).fill(false);
            searchTerms.forEach(term => {
                let i = lower.indexOf(term);
                while (i !== -1) {
                    for (let k = i; k < i + term.length; k++) hit[k] = true;
                    i = lower.indexOf(term, i + term.length);
                }
            });
            let out = '', buf = '', on = false;
            for (let k = 0; k < name.length; k++) {
                if (hit[k] !== on) {
                    out += on ? `<mark class="search-hit">${escapeHTML(buf)}</mark>` : escapeHTML(buf);
                    buf = '';
                    on = hit[k];
                }
                buf += name[k];
            }
            out += on ? `<mark class="search-hit">${escapeHTML(buf)}</mark>` : escapeHTML(buf);
            return out;
        }

const $ = id => document.getElementById(id);
const crumbs = $('crumbs'), chips = $('chips');
const dlg = $('dlg'), dlgTitle = $('dlgTitle'), dlgInput = $('dlgInput'), dlgList = $('dlgList'), dlgOkBtn = $('dlgOk');

const isDir = l => l.startsWith('[::DIR::]');
function parseDir(l) { const r = l.slice(9), i = r.indexOf('|'), j = r.indexOf('|', i + 1); return { id: r.slice(0, i), parent: r.slice(i + 1, j), name: r.slice(j + 1) }; }
function parseMeta(raw) {
    const m = raw.match(/^\[::M:([^|\]:]*)\|([01])\|(\d*)::\]/);
    return m ? { folder: m[1], pin: m[2] === '1', ts: +m[3] || 0, rest: raw.slice(m[0].length) } : { folder: '', pin: false, ts: 0, rest: raw };
}
function setMeta(raw, patch) { const m = parseMeta(raw), x = Object.assign({ folder: m.folder, pin: m.pin, ts: m.ts }, patch); return `[::M:${x.folder}|${x.pin ? 1 : 0}|${x.ts}::]${m.rest}`; }
const save = ls => updateFirebaseText(ls.join('\n'));

    document.body.appendChild(t);
    setTimeout(() => { t.style.opacity = 0; }, 1600);
    setTimeout(() => t.remove(), 2000);
}
function ago(t) {
    const m = (Date.now() - t) / 6e4;
    if (m < 1) return 'just now';
    if (m < 60) return (m | 0) + 'm ago';
    if (m < 1440) return ((m / 60) | 0) + 'h ago';
    if (m < 43200) return ((m / 1440) | 0) + 'd ago';
    return new Date(t).toLocaleDateString([], { day: 'numeric', month: 'short', year: 'numeric' });
}

function pathOf(id) {
    const ds = getLines().filter(isDir).map(parseDir), p = [];
    while (id) { const d = ds.find(x => x.id === id); if (!d || p.length > 20) break; p.unshift(d); id = d.parent; }
    return p;
}
const countIn = id => getLines().filter(l => isDir(l) ? parseDir(l).parent === id : parseMeta(l).folder === id).length;

// which lines to show (current folder + filter chip + title search), folders first, then pinned
function order(lines) {
    const out = [], S = searchTerms.length;
    lines.forEach((l, i) => {
        if (isDir(l)) { const d = parseDir(l); if (S ? titleMatches(d.name) : (d.parent === curFolder && filt === 'all')) out.push(i); return; }
        const p = parseLine(l), u = !!p.content.match(URL_REGEX);
        if (S ? !titleMatches(p.name) : p.folder !== curFolder) return;
        if ((filt === 'link' && !u) || (filt === 'text' && u) || (filt === 'pin' && !p.pin)) return;
        out.push(i);
    });
    const r = i => isDir(lines[i]) ? 0 : (parseLine(lines[i]).pin ? 1 : 2);
    return out.sort((a, b) => r(a) - r(b) || a - b);
}

function dirCard(i) {

    p.forEach((d, i) => { h += `<i data-lucide="chevron-right" class="w-4 h-4 text-gray-400 shrink-0"></i><button onclick="openDir('${d.id}')" class="${cls(i === p.length - 1)}">${escapeHTML(d.name)}</button>`; });

    $('filterMenu').innerHTML = FILTERS.map(([k, t, ic]) =>
        `<button onclick="setFilt('${k}')" class="w-full flex items-center gap-2.5 px-3 py-2.5 rounded-lg text-sm font-semibold text-left transition ${filt === k ? 'bg-blue-50 dark:bg-blue-900/30 text-primary' : 'text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-800'}"><i data-lucide="${ic}" class="w-4 h-4"></i><span class="flex-1">${t}</span>${filt === k ? '<i data-lucide="check" class="w-4 h-4"></i>' : ''}</button>`).join('');

    lucide.createIcons();
}
function refresh() { activeEditIndex = null; renderViewModeText(latestText); renderEditModeText(); updateSearchCount(); }

function openDlg(title, o) {
    dlgTitle.textContent = title;
    dlgInput.classList.toggle('hidden', o.val == null);
    dlgInput.value = o.val || '';
    dlgList.innerHTML = '';
    dlgOkBtn.classList.toggle('hidden', !!o.list);
    dlgCb = o.ok || null;
    (o.list || []).forEach(([label, fn]) => {
        const b = document.createElement('button');
        b.className = 'text-left px-4 py-3 rounded-xl bg-gray-50 dark:bg-gray-800 hover:bg-blue-50 dark:hover:bg-blue-900/30 text-gray-800 dark:text-gray-200 font-medium truncate shrink-0';

        b.onclick = () => { closeDlg(); fn(); };
        dlgList.appendChild(b);

}

// ---- folder actions ----
window.newDir = () => openDlg('New folder', { val: '', ok: async n => { if (await save([`[::DIR::]${rid()}|${curFolder}|${n}`, ...getLines()])) toast('Folder created'); } });
window.renameDir = id => {
    const ls = getLines(), i = ls.findIndex(l => isDir(l) && parseDir(l).id === id); if (i < 0) return;
    const d = parseDir(ls[i]);
    openDlg('Rename folder', { val: d.name, ok: async n => { ls[i] = `[::DIR::]${d.id}|${d.parent}|${n}`; if (await save(ls)) toast('Renamed'); } });
};
window.deleteDir = id => {
    const ds = getLines().filter(isDir).map(parseDir), me = ds.find(d => d.id === id); if (!me) return;
    const ids = new Set([id]); let n;
    do { n = ids.size; ds.forEach(d => { if (ids.has(d.parent)) ids.add(d.id); }); } while (ids.size !== n);
    showCustomConfirm('Delete folder?', `"${me.name}" and everything inside it will be deleted from all devices.`, async () => {
        await save(getLines().filter(l => isDir(l) ? !ids.has(parseDir(l).id) : !ids.has(parseMeta(l).folder)));
        if (ids.has(curFolder)) curFolder = '';
    });
};
window.moveNote = i => {
    const ds = getLines().filter(isDir).map(parseDir);
    const opts = [['🏠 Home', '']].concat(ds.map(d => ['📁 ' + pathOf(d.id).map(x => x.name).join(' / '), d.id]));
    openDlg('Move to…', { list: opts.map(([t, id]) => [t, async () => { const ls = getLines(); ls[i] = setMeta(ls[i], { folder: id }); if (await save(ls)) toast('Moved'); }]) });
};
window.togglePin = async i => {
    const ls = getLines(), was = parseMeta(ls[i]).pin;
    ls[i] = setMeta(ls[i], { pin: !was });
    if (await save(ls)) toast(was ? 'Unpinned' : 'Pinned to top');
};

$('exportBtn').onclick = () => {

$('importBtn').onclick = () => $('importInput').click();
$('importInput').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try {
        const j = JSON.parse(await f.text()), have = new Set(getLines()), add = getLines(j.text || '').filter(l => !have.has(l));

var rendering = 'view'; /* V6-VIEW-NO-EDIT-ICONS */

// ================= VIEW MODE RENDER =================
        function renderViewModeText(text) {
            rendering = 'view';
            if (curFolder && !pathOf(curFolder).length) curFolder = '';
            drawNav();
            if (!text || text.trim() === "") {
                notesContainer.innerHTML = `
                    <div class="flex flex-col items-center justify-center h-full opacity-40 mt-10">
                        <i data-lucide="inbox" class="w-16 h-16 mb-4"></i>
                        <p class="text-xl font-semibold">Ready to receive links</p>
                        <p class="mt-1 text-sm">Paste a link below and hit send.</p>
                    </div>`;
                lucide.createIcons();
                return;
            }

            const lines = getLines(text);
            
            let htmlContent = "";
            order(lines).forEach(index => {
                const rawLine = lines[index];
                if (isDir(rawLine)) { htmlContent += dirCard(index); return; }
                const { name, content } = parseLine(rawLine);
                if (searchTerms.length && !titleMatches(name)) return; // search: sirf title se

                // ---------- CARD WITH TITLE: white card (plain card jaisa clear), upar title, neeche link/text ----------
                if (name) {
                    const hasBody = content.trim() !== "";
                    const { safe: safeBody, firstUrl } = highlightUrls(content, "text-primary font-semibold underline underline-offset-2");
                    const clickAttr = firstUrl ? `onclick="window.openSafeUrl(${index}, event)"` : '';

                    htmlContent += `
                        <div ${clickAttr} class="named-card named-accent note-box group w-full shrink-0 border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900 hover:border-primary/50 rounded-xl text-gray-800 dark:text-gray-200 shadow-sm transition hover:shadow-md ${firstUrl ? 'cursor-pointer' : ''} flex flex-col overflow-hidden relative">${badge(rawLine)}
                            <div class="flex items-center gap-2.5 px-3.5 md:px-4 ${hasBody ? 'pt-3 pb-2.5 shrink-0' : 'flex-1'}">
                                <i data-lucide="tag" class="w-5 h-5 shrink-0 text-amber-500"></i>
                                <span class="flex-1 min-w-0 font-bold text-gray-900 dark:text-white text-lg md:text-xl leading-snug truncate">${highlightTitle(name)}</span>
                                ${hasBody ? `
                                <div class="flex items-center gap-1 shrink-0 opacity-100 md:opacity-0 group-hover:opacity-100 transition-opacity">
                                    ${firstUrl ? `<div class="text-primary p-1.5"><i data-lucide="external-link" class="w-5 h-5"></i></div>` : ''}
                                    ${pinBtn(index)}<button onclick="event.stopPropagation(); window.copySingleNote(${index})" class="p-1.5 text-gray-400 hover:text-primary hover:bg-blue-50 dark:hover:bg-blue-900/30 rounded-lg transition" title="Copy">
                                        <i data-lucide="copy" class="w-5 h-5"></i>
                                    </button>
                                </div>` : ''}
                            </div>
                            ${hasBody ? `
                            <div class="mx-3.5 md:mx-4 border-t border-dashed border-gray-200 dark:border-gray-700 shrink-0"></div>
                            <div class="flex-1 min-h-0 flex items-center gap-3 px-3.5 md:px-4 overflow-hidden">
                                <i data-lucide="${firstUrl ? 'link' : 'align-left'}" class="w-5 h-5 shrink-0 text-gray-400 group-hover:text-primary transition-colors"></i>
                                <div class="min-w-0 flex-1 whitespace-pre-wrap break-words leading-relaxed text-base md:text-lg line-clamp-2">${safeBody}</div>
                            </div>` : ''}
                        </div>
                    `;
                    return;
                }

                // ---------- NORMAL CARD (bina title, bilkul pehle jaisa) ----------
                const { safe: safeLine, firstUrl } = highlightUrls(content, "text-primary font-semibold underline underline-offset-2");

                const iconName = firstUrl ? 'link' : 'align-left';
                const clickAttr = firstUrl ? `onclick="window.openSafeUrl(${index}, event)"` : '';
                
                // UI FIX: Added shrink-0 to prevent box from getting smaller when list overflows
                htmlContent += `
                    <div ${clickAttr} class="note-box group w-full shrink-0 border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900 hover:border-primary/50 p-3.5 md:p-4 rounded-xl text-gray-800 dark:text-gray-200 flex items-center gap-3 md:gap-4 shadow-sm transition hover:shadow-md cursor-pointer overflow-hidden relative">${badge(rawLine)}
                        <div class="text-gray-400 group-hover:text-primary transition-colors shrink-0 flex items-center justify-center">
                            <i data-lucide="${iconName}" class="w-5 h-5 md:w-6 md:h-6"></i>
                        </div>
                        <div class="flex-1 min-w-0 flex items-center">
                            <div class="whitespace-pre-wrap break-words leading-relaxed text-base md:text-lg line-clamp-3">${safeLine}</div>
                        </div>
                        <div class="flex items-center gap-1 shrink-0 opacity-100 md:opacity-0 group-hover:opacity-100 transition-opacity">
                            ${firstUrl ? `<div class="text-primary p-2"><i data-lucide="external-link" class="w-5 h-5"></i></div>` : ''}
                            ${pinBtn(index)}<button onclick="event.stopPropagation(); window.copySingleNote(${index})" class="p-2 text-gray-400 hover:text-primary hover:bg-blue-50 dark:hover:bg-blue-900/30 rounded-lg transition" title="Copy">
                                <i data-lucide="copy" class="w-5 h-5"></i>
                            </button>
                        </div>
                    </div>
                `;
            });
            
            notesContainer.innerHTML = htmlContent || noMatchHTML();
            lucide.createIcons();
            
            // Auto-scroll to top so latest new data is always visible immediately
            notesContainer.scrollTop = 0;
        }

        // ================= EDIT MODE RENDER =================
        window.renderEditModeText = function() {
            rendering = 'edit';
            if (activeEditIndex !== null) return; 
            
            const lines = getLines();
            if (lines.length === 0) {
                editNotesContainer.innerHTML = `<div class="text-center text-gray-400 mt-10 flex flex-col items-center"><i data-lucide="file-x" class="w-12 h-12 mb-3 opacity-30"></i> No notes to edit.</div>`;
                lucide.createIcons();
                return;
            }

            let htmlContent = "";
            order(lines).forEach(index => {
                const rawLine = lines[index];
                if (isDir(rawLine)) { htmlContent += dirCard(index); return; }
                const { name, content } = parseLine(rawLine);
                if (searchTerms.length && !titleMatches(name)) return; // search: sirf title se
                const safeLine = escapeHTML(content);
                const hasName = name !== "";
                
                // UI FIX: Added shrink-0 to prevent box from getting smaller when list overflows
                htmlContent += `
                    <div id="edit-card-${index}" onclick="openInlineEdit(${index})" class="note-box ${hasName ? 'named-accent ' : ''}group w-full shrink-0 border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900 hover:border-primary/50 p-3.5 md:p-4 rounded-xl text-gray-800 dark:text-gray-200 flex items-center justify-between gap-3 md:gap-4 shadow-sm transition hover:shadow-md cursor-pointer overflow-hidden">
                        <div class="flex-1 min-w-0 flex flex-col justify-center">
                            ${hasName ? `
                            <div class="flex items-center gap-1.5 font-bold text-gray-900 dark:text-white text-sm md:text-base mb-0.5 min-w-0">
                                <i data-lucide="tag" class="w-4 h-4 shrink-0 text-amber-500"></i>
                                <span class="truncate">${highlightTitle(name)}</span>
                            </div>` : ''}
                            <div class="whitespace-pre-wrap break-words leading-relaxed ${hasName ? 'text-sm md:text-base text-gray-500 dark:text-gray-400 line-clamp-2' : 'text-base md:text-lg line-clamp-3'}">${safeLine}</div>
                        </div>
                        <div class="flex items-center gap-1 shrink-0 md:opacity-0 group-hover:opacity-100 transition-opacity">
                            ${pinBtn(index)}${moveBtn(index)}<button onclick="event.stopPropagation(); window.deleteLine(${index})" class="p-2 hover:text-red-600 hover:bg-red-50 dark:hover:bg-red-900/30 rounded-lg transition" title="Delete Note">
                                <i data-lucide="trash-2" class="w-5 h-5"></i>
                            </button>
                            <button class="hidden sm:block p-2 text-primary hover:bg-blue-50 dark:hover:bg-blue-900/30 rounded-lg transition" title="Edit Note">
                                <i data-lucide="pencil" class="w-5 h-5"></i>
                            </button>
                        </div>
                    </div>
                `;
            });
            
            editNotesContainer.innerHTML = htmlContent || noMatchHTML();
            lucide.createIcons();
        }

        // ================= INLINE EDIT W/ LOADER (title box always visible, optional) =================
        window.openInlineEdit = function(index) {
            activeEditIndex = index;
            const lines = getLines();
            const card = document.getElementById(`edit-card-${index}`);
            const { name, content } = parseLine(lines[index]);
            
            // Added shrink-0 here as well to prevent the edit box from shrinking
            card.className = "w-full shrink-0 border-2 border-primary dark:border-primary bg-white dark:bg-gray-900 p-4 md:p-5 rounded-xl shadow-lg transition pop-animation";
            card.onclick = null; 

            card.innerHTML = `
                <div class="relative mb-3">
                    <i data-lucide="tag" class="w-4 h-4 text-gray-500 dark:text-gray-400 absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none"></i>
                    <input type="text" id="inline-name" maxlength="40" autocomplete="off" class="${NAME_INPUT_CLASS}" placeholder="Title / Name (Optional)">
                </div>
                <textarea id="inline-input" class="w-full bg-transparent text-gray-900 dark:text-gray-100 focus:outline-none resize-none text-base md:text-lg leading-relaxed border-b border-gray-200 dark:border-gray-800 pb-3 mb-3 min-w-0 whitespace-pre-wrap" rows="4" placeholder="Edit your note..."></textarea>
                <div class="flex justify-end gap-2">
                    <button id="cancel-inline-btn" onclick="window.cancelInlineEdit()" class="px-5 py-2.5 text-gray-600 dark:text-gray-400 font-semibold hover:bg-gray-100 dark:hover:bg-gray-800 rounded-lg transition flex items-center gap-2"><i data-lucide="x" class="w-4 h-4"></i> Cancel</button>
                    <button id="save-inline-btn" onclick="window.saveInlineEdit(${index})" class="px-6 py-2.5 bg-primary hover:bg-blue-700 text-white font-semibold rounded-lg transition shadow-sm flex items-center gap-2 disabled:opacity-80"><i data-lucide="check" class="w-4 h-4"></i> Save</button>
                </div>
            `;
            
            const input = document.getElementById('inline-input');
            const nameInput = document.getElementById('inline-name');
            nameInput.value = name;
            nameInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') { e.preventDefault(); input.focus(); }
            });
            input.value = content;
            input.focus();
            input.setSelectionRange(input.value.length, input.value.length);
            lucide.createIcons();
        };

        window.cancelInlineEdit = function() {
            activeEditIndex = null;
            renderEditModeText();
        }

        window.saveInlineEdit = async function(index) {
            const saveBtn = document.getElementById('save-inline-btn');
            const cancelBtn = document.getElementById('cancel-inline-btn');
            const originalHtml = saveBtn.innerHTML;
            
            saveBtn.innerHTML = `<i data-lucide="loader" class="w-4 h-4 animate-spin"></i> Saving...`;
            saveBtn.disabled = true;
            cancelBtn.disabled = true;
            lucide.createIcons();

            const newVal = document.getElementById('inline-input').value.trim().replace(/\r?\n/g, ' ↵ ');
            const newName = sanitizeName(document.getElementById('inline-name').value);
            let lines = getLines();
            
            if (newVal === "") { lines.splice(index, 1); }
            else { lines[index] = buildLine(newName, newVal, parseMeta(lines[index])); }
            
            const success = await updateFirebaseText(lines.join('\n'));
            if (success) {
                activeEditIndex = null;
                renderEditModeText(); 
            } else {
                saveBtn.innerHTML = originalHtml;
                saveBtn.disabled = false;
                cancelBtn.disabled = false;
                lucide.createIcons();
            }
        }

        window.deleteLine = function(index) {
            showCustomConfirm("Delete this note?", "Are you sure you want to remove this specific note from all devices?", async () => {
                let lines = getLines();
                lines.splice(index, 1);
                await updateFirebaseText(lines.join('\n'));
                activeEditIndex = null;
                renderEditModeText();
            });
        }

        // ================= FIREBASE SYNC (ORIGINAL LOGIC) =================
        async function updateFirebaseText(newText) {
            try {
                await setDoc(noteDocRef, { text: newText, timestamp: new Date().getTime() });
                return true;
            } catch (err) {
                console.error("Firebase Error: ", err);
                return false;
            }
        }

        onSnapshot(noteDocRef, (docSnap) => {
            statusIndicator.innerText = "Online";
            statusIndicator.classList.replace('text-gray-500', 'text-emerald-600');
            statusDot.classList.replace('bg-yellow-500', 'bg-emerald-500');
            statusDot.classList.remove('animate-pulse');
            
            if (docSnap.exists()) {
                const data = docSnap.data();
                latestText = data.text || "";
                if(data.timestamp) {
                    lastUpdated.innerText = `Updated: ${new Date(data.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}`;
                }
            } else {
                latestText = "";
            }
            
            renderViewModeText(latestText);
            if (isEditMode && activeEditIndex === null) {
                renderEditModeText();
            }
            updateSearchCount();
        }, (error) => {
            statusIndicator.innerText = "Offline";
            statusIndicator.classList.replace('text-emerald-600', 'text-red-500');
            statusDot.classList.replace('bg-emerald-500', 'bg-red-500');
        });

        // ================= GLOBAL ACTIONS W/ LOADERS =================
        quickSendBtn.addEventListener('click', async () => {
            const newText = quickInput.value.trim().replace(/\r?\n/g, ' ↵ ');

            const name = isNameOn(quickNameToggle) ? sanitizeName(quickName.value) : "";

            // FIXED: Naya data aage add kiya (Prepend) taaki wo sabse top par aaye
            const combinedText = latestText ? `${newLine}\n${latestText}` : newLine;
            
            const originalHTML = quickSendBtn.innerHTML;
            quickSendBtn.innerHTML = `<i data-lucide="loader" class="w-5 h-5 animate-spin"></i>`;

            const success = await updateFirebaseText(combinedText);
            if(success) {
                quickInput.value = "";
                quickName.value = "";
                setNameField(quickNameToggle, false, false);
            }
            
            setTimeout(() => { 
                quickSendBtn.innerHTML = originalHTML; 
                quickSendBtn.disabled = false;
                lucide.createIcons();
            }, 500);
        });
        quickInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') quickSendBtn.click(); });
        quickName.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                if (quickInput.value.trim()) quickSendBtn.click(); else quickInput.focus();
            }
        });

        clearBtn.addEventListener('click', () => {
            if(!latestText.trim()) return; 
            
            showCustomConfirm("Clear All Notes?", "Do you want to delete ALL notes? This will instantly wipe them from your TV and phone.", async () => {
                await updateFirebaseText("");
            });
        });

        // Copy All / Download: titled notes "Title: link" format me copy hote hain
        function getPlainTextAll() {
            return getLines().filter(l => !isDir(l) && parseLine(l).folder === curFolder).map(lineToPlainText).join('\n');
        }

        copyBtn.addEventListener('click', async () => {
            try {
                if(!latestText.trim()) return;
                const trueText = getPlainTextAll();
                await navigator.clipboard.writeText(trueText);
                
                const original = copyBtn.innerHTML;
                copyBtn.innerHTML = `<i data-lucide="check" class="w-4 h-4"></i> Copied!`;
                lucide.createIcons();
                setTimeout(() => { copyBtn.innerHTML = original; lucide.createIcons(); }, 1500);
            } catch(e) { document.execCommand('copy'); }
        });

        // QR Modal Logic
        const qrBtn = document.getElementById('qrBtn');
        const qrModal = document.getElementById('qrModal');
        const closeQrBtn = document.getElementById('closeQrBtn');

        qrBtn.addEventListener('click', () => {
            qrModal.classList.remove('hidden-mode');
            qrModal.classList.add('modal-active');

            qrModal.classList.remove('modal-active');
            qrModal.classList.add('hidden-mode');
        });
        
        

    </script>
